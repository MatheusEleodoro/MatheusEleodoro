name: Update README Cards

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Fetch repos
        run: curl -s "https://api.github.com/users/MatheusEleodoro/repos?sort=pushed" > repos.json

      - name: Generate cards
        run: |
          echo "<table><tr>" > cards.html

          jq -r '.[:3][] | "<td width=\"33%\" align=\"center\"> <img src=\"https://img.shields.io/badge/%20-Project-0A66C2?style=for-the-badge\"/> <h3>" + .name + "</h3> <sub>" + ((.description // "No description")[0:80]) + "</sub> <br><br> <img src=\"https://img.shields.io/badge/Lang-" + (.language // "N/A") + "-ED8B00?style=flat-square\"/> <br><br><br> <a href=\"" + .html_url + "\"><img src=\"https://img.shields.io/badge/View-181717?style=for-the-badge&logo=github\"/></a> </td>"' repos.json >> cards.html

          echo "</tr></table>" >> cards.html

      - name: Update README
        run: |
          awk '
          BEGIN {p=1}
          /<!--START_SECTION:cards-->/ {print; system("cat cards.html"); p=0; next}
          /<!--END_SECTION:cards-->/ {p=1}
          p
          ' README.md > README.tmp && mv README.tmp README.md

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add README.md
          git commit -m "update cards" || echo "No changes"
          git push
