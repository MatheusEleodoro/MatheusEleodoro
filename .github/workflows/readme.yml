name: Update README Cards

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Fetch repos
        run: |
          curl -s https://api.github.com/users/MatheusEleodoro/repos?sort=pushed > repos.json

      - name: Generate cards (padronizado)
        run: |
          echo "<table><tr>" > cards.html

          cat repos.json | jq -r '
            .[0:3] |
            .[] |
            (
              .description // "No description"
            ) as $desc |
            "<td width=\"33%\" align=\"center\">

<img src=\"https://img.shields.io/badge/%20-Project-0A66C2?style=for-the-badge&logo=github&labelColor=0A66C2\"/>

### " + .name + "

<sub>" + ($desc[0:80]) + "</sub>

<br><br>

<img src=\"https://img.shields.io/badge/Lang-" + (.language // "N/A") + "-ED8B00?style=flat-square\"/>

<br><br><br>

<a href=\"" + .html_url + "\">
<img src=\"https://img.shields.io/badge/View-181717?style=for-the-badge&logo=github\"/>
</a>

</td>"
          ' >> cards.html

          echo "</tr></table>" >> cards.html

      - name: Inject into README
        run: |
          sed -i '/<!--START_SECTION:cards-->/,/<!--END_SECTION:cards-->/c\
<!--START_SECTION:cards-->\
\
'"$(cat cards.html)"'\
\
<!--END_SECTION:cards-->' README.md

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add README.md
          git commit -m "update cards" || echo "no changes"
          git push
